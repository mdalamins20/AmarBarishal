name: my_barishal_new
description: "A new Flutter project."
publish_to: 'none'
version: 4.4.1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  firebase_core: ^3.1.1
  cloud_firestore: ^5.0.2
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  firebase_auth: ^5.1.1
  firebase_messaging: ^15.0.2
  flutter_local_notifications: ^17.2.1+1
  intl: ^0.20.2
  flutter_staggered_animations: ^1.1.1
  url_launcher: ^6.2.5
  provider: ^6.1.2
  package_info_plus: ^9.0.0
  webview_flutter: ^4.13.0
  share_plus: ^12.0.2
  translator: ^1.0.4+1
  http: ^1.6.0
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  googleapis_auth: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121212"
  image: "assets/icon/splash_logo.png"   # ✅ কোটেশনে রাখা হয়েছে
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/                # ✅ যদি পুরো ফোল্ডার ব্যবহার করতে চাও
    - assets/icon/splash_logo.png  # ✅ স্প্ল্যাশ লোগো
    - assets/icon/icon.png         # ✅ লঞ্চার আইকনও add করে রাখা ভালো
    - assets/images/header_bg.png
